# Written by tools/pack_variants.py apply (the Smith family server repo, pack/meta/variants.toml variant "craftlabs"):
# don't edit, re-run it. This pack is also the CraftLabs client pack: packwiz-installer gives a client the entries
# with side "client" or "both" and the server those with "server" or "both". apply adds the client-side entries
# under [managed] (the server never installs them) and sets each server entry's side as [sides] says: "both" where
# a client needs the mod too, "server" where it doesn't. The server's install stays exactly what it was.

